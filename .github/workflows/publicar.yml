name: Publicar en X

# EL RELOJ ES LA CORRIDA, NO EL CRON
#
# Medido el 07/09/2026 contra la API de Actions: en 48 horas el cron disparo
# 12 veces, con huecos de entre 1,4 y 7,5 horas. Un cron cada 10 minutos no
# cambio nada: 6,4 horas sin una sola corrida.
#
# La corrida es un TURNO: se queda viva hasta 5,5 horas mirando el reloj y
# publica cada post en la hora del calendario. Al terminar, enciende a
# "Relevo" (relevo.yml), y Relevo al terminar enciende a este. Un workflow no
# puede encadenarse a si mismo, por eso son dos. El cron queda como respaldo.

on:
  schedule:
    - cron: "1-59/10 * * * *"
  workflow_run:
    workflows: ["Relevo"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publicar_de_verdad:
        description: "Publicar en X (si no, solo modo prueba)"
        type: boolean
        default: false

concurrency:
  group: publicar-en-x
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          MODO: ${{ github.event_name == 'workflow_dispatch' && 'una' || 'turno' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publicar_de_verdad && 'true' || 'false' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python publicar.py
      - name: Guardar la salida para revisar
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: posts-${{ github.run_number }}
          path: salida/
          retention-days: 7
          if-no-files-found: ignore
