name: Publicar en X

# El cron de GitHub. Los horarios van en UTC: Argentina es UTC-3, así que
# para publicar a las 09:10 hora local hay que poner 12:10 acá.
#
# 7 posts por dia, cargados hacia la tarde-noche que es cuando la audiencia
# argentina esta en X. Ningun horario cae en el minuto :00 a proposito: es
# cuando todo el mundo programa sus crons y GitHub se congestiona.
#
#   09:10 AR = 12:10 UTC     18:10 AR = 21:10 UTC
#   12:40 AR = 15:40 UTC     19:50 AR = 22:50 UTC
#   15:20 AR = 18:20 UTC     21:40 AR = 00:40 UTC (dia siguiente)
#                            23:15 AR = 02:15 UTC (dia siguiente)
#
# VENTANA_MIN=1440 (un dia): el 05/09/2026 el cron disparo con MAS DE DOS
# HORAS de atraso, el triple de lo que documenta GitHub, y la ventana de 90
# minutos descarto un post que estaba perfecto. La regla ahora es simple: se
# publica cualquier post pendiente DE HOY cuya hora ya paso. Una oferta dos
# horas tarde sigue sirviendo; una de ayer no.

on:
  schedule:
    - cron: "10 12 * * *"
    - cron: "40 15 * * *"
    - cron: "20 18 * * *"
    - cron: "10 21 * * *"
    - cron: "50 22 * * *"
    - cron: "40 0 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:          # botón para correrlo a mano cuando quieras
    inputs:
      publicar_de_verdad:
        description: "Publicar en X (si no, solo modo prueba)"
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Para usar TU computadora como runner en vez de la de GitHub,
    # cambiá la línea de arriba por:  runs-on: self-hosted
    # Es lo único que cambia. Todo lo demás funciona igual.

    permissions:
      contents: write         # necesario para guardar estado.json de vuelta en el repo

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar
        env:
          VENTANA_MIN: ${{ github.event_name == 'workflow_dispatch' && '10080' || '1440' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publicar_de_verdad && 'true' || 'false' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python publicar.py

      - name: Guardar el estado
        # Guardar el estado NUNCA debe voltear la corrida: si el push falla, el post
        # ya salio igual. Y antes de pushear se rebasa, para que un re-run sobre un
        # commit viejo no choque contra un main que ya avanzo.
        continue-on-error: true
        run: |
          git config user.name  "moa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos/estado.json
          if git diff --staged --quiet; then
            echo "sin cambios en el estado"
            exit 0
          fi
          git commit -m "estado: $(date -u +%F\ %H:%M) [skip ci]"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin HEAD:main

      - name: Guardar la salida para revisar
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: posts-${{ github.run_number }}
          path: salida/
          retention-days: 7
          if-no-files-found: ignore
